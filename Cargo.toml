[workspace]
members = [".", "crates/vosu-lazer-pp", "crates/vosu-test-harness"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
license = "LGPL-3.0-only"

[package]
name = "vosu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

