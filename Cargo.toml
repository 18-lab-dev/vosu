tokio-util = { version = "0.7.18", features = ["io", "rt"] }
tokio-tungstenite = "=0.29.0"
toml = "=1.1.2"
vosu-adapter-support = { path = "crates/vosu-adapter-support" }
vosu-pp = { path = "crates/vosu-pp" }
vosu-core = { path = "crates/vosu-core" }
vosu-plugin-api = { path = "crates/vosu-plugin-api" }
vosu-plugin-testkit = { path = "crates/vosu-plugin-testkit", optional = true }
vosu-osu = { path = "crates/vosu-osu" }
vosu-osu-calc = { path = "crates/vosu-osu-calc" }
vosu-osu-model = { path = "crates/vosu-osu-model" }
vosu-osu-reader = { path = "crates/vosu-osu-reader" }
vosu-osu-state = { path = "crates/vosu-osu-state" }
vosu-net = { path = "crates/vosu-net" }
vosu-surface = { path = "crates/vosu-surface" }
vosu-sys = { path = "crates/vosu-sys" }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "env-filter", "ansi", "registry"] }
url = "2.5.8"
zmij = "=1.0.23"
getrandom = "=0.4.3"
parking_lot = "0.12.5"
subtle = "=2.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_System_SystemInformation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

