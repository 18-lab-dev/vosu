linux-process-events = ["vosu-sys/linux-process-events", "vosu-core/linux-process-events"]
test-harness = ["vosu-core/test-harness", "vosu-net/test-harness", "vosu-osu/test-harness", "vosu-osu-state/test-harness", "vosu-plugin-testkit", "vosu-plugin-testkit/test-harness", "dep:base64"]
