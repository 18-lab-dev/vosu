dotenvy = "0.15.7"
futures-util = "0.3.32"
indexmap = { version = "2.13.0", features = ["serde"] }
md-5 = "0.11.0"
memchr = "=2.8.3"
notify = "=8.2.0"
open = "=5.4.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream", "json"] }
rust-embed = { version = "=8.12.0", features = ["debug-embed", "include-exclude"] }
rustc-hash = "=2.1.3"
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "raw_value"] }
