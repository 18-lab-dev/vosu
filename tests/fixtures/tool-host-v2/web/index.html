<!doctype html>
<meta charset="utf-8">
<title>M3 browser fixture</title>
<img id="icon" src="/tools/fixture-v2/_icon" alt="">
<button id="invoke">Invoke</button><output id="result"></output>
<button id="start">Start</button><output id="progress"></output>
<button id="abort">Abort</button><output id="terminal"></output>
<output id="launch"></output>
<output id="subscription"></output>
<script type="module">
import {vosu} from '/tools/_host/v2/bridge.js';
const output = (id, value) => document.getElementById(id).textContent = JSON.stringify(value);
// A bookmark, reload or replayed launch URL still loads read-only.
try { await vosu.ready; } catch (error) { output('launch', error.message); }
document.documentElement.dataset.ready = String(vosu.canWrite);
const sessions = await (await fetch('/api/v1/sessions')).json();
const fixture = sessions.sessions.find(value => value.plugin.id === 'test.api.fixture');
if (!fixture) throw new Error('Real fixture session missing');
document.documentElement.dataset.session = fixture.session;
const unsubscribe = vosu.subscribe([''], frame => output('subscription', frame), undefined, {session: fixture.session});
addEventListener('pagehide', unsubscribe, {once: true});
let controller;
document.getElementById('invoke').onclick = async () => {
  try { output('result', await vosu.invoke('test.api.fixture.run', {sentinel: 'browser-6187'}, {session: null})); }
  catch (error) { output('result', {error: error.code || error.message}); }
};
document.getElementById('start').onclick = async () => {
  controller = new AbortController();
  try {
    const handle = await vosu.start('test.api.fixture.run', {mode: 'wait_progress'}, {
      session: null, signal: controller.signal,
      onProgress: progress => { if (progress) output('progress', progress); },
    });
    document.documentElement.dataset.job = handle.id;
    await handle.done;
    output('terminal', 'unexpected-success');
  } catch (error) { output('terminal', error.code || error.message); }
};
document.getElementById('abort').onclick = () => controller.abort();
document.documentElement.dataset.loaded = 'true';
</script>
