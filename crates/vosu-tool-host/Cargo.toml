[package]
name = "vosu-tool-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes = "=1.12.1"
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
tokio = { version = "=1.52.3", default-features = false, features = ["rt", "sync"] }
vosu-plugin-api = { path = "../vosu-plugin-api" }
# Bundled registration (`export_plugin!(bundled ...)`, AF.9).
vosu-plugin-internal = { path = "../vosu-plugin-internal" }
vosu-surface = { path = "../vosu-surface" }

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "time"] }
