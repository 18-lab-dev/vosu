[package]
name = "vosu-osu-state"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
test-harness = []

[dependencies]
indexmap = { version = "2.13.0", features = ["serde"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "raw_value"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
tracing = "=0.1.44"
vosu-osu-calc = { path = "../vosu-osu-calc" }
vosu-pp = { path = "../vosu-pp" }
vosu-osu-model = { path = "../vosu-osu-model" }
vosu-osu-reader = { path = "../vosu-osu-reader" }
vosu-sys = { path = "../vosu-sys" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Media"] }

[dev-dependencies]
md-5 = "0.11.0"
tempfile = "3.26.0"
