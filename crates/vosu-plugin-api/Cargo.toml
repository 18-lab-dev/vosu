[package]
name = "vosu-plugin-api"
version = "1.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "vosu 2.0 plugin ABI v1 types, layouts, and codecs (ADR 0019); see docs/v2/plugin-abi.md and include/vosu_plugin.h."

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ciborium = "=0.2.2"
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
proptest = "1.12"
vosu-proptest = { path = "../vosu-proptest" }
