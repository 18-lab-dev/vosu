[package]
name = "vosu-plugin-api"
version = "1.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "vosu 2.0 plugin ABI v1 types, layouts, and codecs (ADR 0019); see docs/v2/plugin-abi.md and include/vosu_plugin.h."

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
# Synchronous read-plan delivery (D5): a plugin's own reader threads only;
# never published (D11).
unstable-sync-reads = []
# Bundled-plugin registration glue consumed by the root crate's explicit
# `BUNDLED` array (D13); never published (D11).
bundled = []

[dependencies]
# Caret, not `=` like every other workspace crate's dependency pins: this is
# the one crate here published to crates.io (D11), so locking a third-party
# plugin's whole dependency graph to our exact serde/ciborium patch would be
# a publishable-SDK regression, not just an internal consistency choice.
ciborium = "0.2.2"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
proptest = "1.12"
vosu-proptest = { path = "../vosu-proptest" }
