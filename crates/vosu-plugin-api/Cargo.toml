[package]
name = "vosu-plugin-api"
version = "1.0.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Plugin SDK for vosu 2.0: ABI v1 types, message codecs, Plugin/ConcurrentPlugin exports and package/catalog validation."
repository = "https://github.com/18-lab-dev/vosu"
homepage = "https://github.com/18-lab-dev/vosu"
documentation = "https://docs.rs/vosu-plugin-api"
readme = "README.md"
keywords = ["vosu", "osu", "plugin", "sdk", "abi"]
categories = ["api-bindings", "development-tools::ffi"]
# The published package is exactly this list (AF.9): no workspace-relative
# file is needed to build, test or run its example. Workspace-only header,
# packaging-schema and property tests live in the root crate's `tests/sdk/`.
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"

[lints]
workspace = true

# No Cargo features: Cargo has no unpublished features, so everything here
# ships to crates.io. Synchronous reads and bundled registration live in the
# `publish = false` `vosu-plugin-internal` crate (AF.9, implementation plan
# D11); `scripts/check-crate-boundaries.py` rejects a feature here.

[dependencies]
# Caret, not `=` like every other workspace crate's dependency pins: this is
# the one crate here published to crates.io (D11), so locking a third-party
# plugin's whole dependency graph to our exact serde/ciborium patch would be
# a publishable-SDK regression, not just an internal consistency choice.
ciborium = "0.2.2"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order", "raw_value"] }
thiserror = "2.0.18"
toml = "1.1.2"
url = "2.5.8"

# AF.10's publisher-side checker over this SDK's own validators; its unit
# tests run with `cargo test -p vosu-plugin-api`.
[[example]]
name = "vosu-package-check"
path = "examples/vosu-package-check/main.rs"
test = true
