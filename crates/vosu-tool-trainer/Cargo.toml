[package]
name = "vosu-tool-trainer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vosu-trainer"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
vosu-tool-sdk = { path = "../vosu-tool-sdk" }
axum = { version = "=0.8.9", features = ["json", "query"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
anyhow = "1"
hound = "3.5.1"
minimp3 = "0.6.1"
vorbis_rs = "0.5.6"
signalsmith-stretch = "0.1.3"
rubato = { version = "0.16.2", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
open = "=5.4.0"

[dev-dependencies]
tempfile = "3.26.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
