[package]
name = "vosu-tool-sdk"
version = "0.1.0"
description = "Rust helpers for the vosu tool protocol v1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
subtle = "=2.6.1"
thiserror = "2.0.18"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "time", "signal"] }
