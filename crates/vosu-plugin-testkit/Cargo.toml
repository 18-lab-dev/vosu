[package]
name = "vosu-plugin-testkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "vosu_plugin_testkit"
path = "src/lib.rs"
# "rlib" lets the root crate's `BUNDLED` array call the serialized echo
# plugin's bundled-form `vosu_plugin_vtable()` directly as a Rust function
# pointer (D13); "cdylib" additionally builds the same crate as a loadable
# shared library exporting `vosu_plugin_entry_v1`, which `tests/plugin_host.rs`
# `dlopen`s to exercise the external-plugin path end to end.
crate-type = ["rlib", "cdylib"]

[features]
default = []
# `vosu-plugin-api/unstable-sync-reads` backs `read_plan.rs`'s own
# `PlanMemory` use (D5): only the test-harness build needs it, never a
# published build of this crate (which never ships at all, `publish =
# false` above, but the split still documents the boundary).
# Bench-only production-host fixtures; test-harness rejects release builds.
# Production must never enable this feature.
bench-harness = []
test-harness = ["bench-harness", "vosu-plugin-api/unstable-sync-reads"]

[dependencies]
vosu-plugin-api = { path = "../vosu-plugin-api" }

[[example]]
name = "api_v1_plugin"
crate-type = ["cdylib"]
required-features = ["test-harness"]

# M5 P0's `runtime = "process"` fixture, staged per test by
# `tests/plugin_host_native/support` and never linked into anything. It needs
# no feature, so the frozen acceptance build runs without `--features`.
[[example]]
name = "testkit_process_plugin"
crate-type = ["cdylib"]
