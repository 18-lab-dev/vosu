[package]
name = "vosu-release-smoke"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json"] }
serde_json = "=1.0.150"
tempfile = "3.26.0"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "time"] }
toml = "=1.1.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "=0.2.186"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
