[package]
name = "vosu-tool-skill-tracker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vosu-skill-tracker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
chrono = { version = "0.4.44", features = ["serde"] }
futures-util = "0.3.32"
libm = "0.2.16"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tokio-tungstenite = "0.29.0"
vosu-tool-sdk = { path = "../vosu-tool-sdk" }

[dev-dependencies]
tempfile = "3.26.0"
