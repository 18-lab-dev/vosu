manifest_version = 1
id = "skill-tracker"
name = "Skill Tracker"
version = "0.1.0"
description = "Local play history, experimental mania skill ratings and session progression."
author = "18-LAB"
[ui]
root = "web"
[service]
command = ["bin/vosu-skill-tracker"]
startup = "always"
[api]
read = ["/v1/profile", "/v1/history", "/v1/current", "/v1/stream", "/v1/plays", "/v1/jobs"]
write = ["/v1/import", "/v1/jobs", "/v1/plays"]
[[requires]]
id = "difficulty"
version = ">=0.1.0"
[permissions]
host = ["context"]

[cli]
command = ["bin/vosu-skill-tracker", "cli"]
summary = "Inspect ratings, export history, and import stable scores"
