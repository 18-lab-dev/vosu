[package]
name = "vosu-osu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
# Per-crate test-harness seam (mirrors vosu-core, vosu-osu-state): never
# enabled in a release build (src/lib.rs's `compile_error!` guard).
test-harness = []

[dependencies]
arc-swap = "1.8.2"
bytes = "=1.12.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "raw_value"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
vosu-osu-model = { path = "../vosu-osu-model" }
vosu-osu-reader = { path = "../vosu-osu-reader" }
vosu-osu-state = { path = "../vosu-osu-state" }
vosu-plugin-api = { path = "../vosu-plugin-api", features = ["bundled", "unstable-sync-reads"] }
vosu-surface = { path = "../vosu-surface" }
tempfile = "3.26.0"
thiserror = "2.0.18"
rosu-map = "=0.2.1"
vosu-net = { path = "../vosu-net" }

[dev-dependencies]
proptest = "1.12"
vosu-proptest = { path = "../vosu-proptest" }
vosu-osu-calc = { path = "../vosu-osu-calc" }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
