[package]
name = "vosu-osu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
# Per-crate test-harness seam (mirrors vosu-core, vosu-osu-state): never
# enabled in a release build (src/lib.rs's `compile_error!` guard). Both the
# bundled harness daemon and external osu! process fixture can replay M5's
# source oracle through the same production publisher.
test-harness = ["bench-harness", "dep:vosu-osu-calc"]
# Instance-owned production-publisher fixtures, including release benchmarks.
bench-harness = []

[dependencies]
arc-swap = "1.8.2"
bytes = "=1.12.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "raw_value"] }
sha2 = "=0.11.0"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
vosu-osu-calc = { path = "../vosu-osu-calc", optional = true }
vosu-osu-model = { path = "../vosu-osu-model" }
vosu-osu-reader = { path = "../vosu-osu-reader" }
vosu-osu-state = { path = "../vosu-osu-state" }
vosu-plugin-api = { path = "../vosu-plugin-api" }
# `PlanMemory` synchronous reads and bundled/process registration (AF.9).
vosu-plugin-internal = { path = "../vosu-plugin-internal" }
tempfile = "3.26.0"
thiserror = "2.0.18"
rosu-map = "=0.2.1"
vosu-net = { path = "../vosu-net" }
vosu-sys = { path = "../vosu-sys" }

[dev-dependencies]
proptest = "1.12"
vosu-proptest = { path = "../vosu-proptest" }
vosu-osu-calc = { path = "../vosu-osu-calc" }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# M5 P0's external osu! process-runtime fixture: the bundled producer as a
# separately staged `cdylib`, development and test only.
[[example]]
name = "osu_process_plugin"
crate-type = ["cdylib"]
required-features = ["test-harness"]
