kind = "plugin"
manifest_version = 1
id = "vosu.osu"
name = "osu!"
version = "2.0.0-alpha.0"
host = ">=1.2.0, <3.0.0"
abi_version = 1
runtime = "in-process"
concurrent_dispatch = true
settings_schema = "settings.schema.json"
covers = ["field:vosu.status.status",
          "field:vosu.chart.title", "field:vosu.chart.artist", "field:vosu.chart.difficultyName", "field:vosu.chart.charter",
          "field:vosu.chart.length", "field:vosu.chart.bpm", "field:vosu.chart.keyCount",
          "field:vosu.play", "field:vosu.skin.name"]

[[provides]]
id = "field:vosu.osu"
version = "1.2.0"
schema = "schemas/vosu.osu.schema.json"

[match]
process_names = ["osu!.exe", "osulazer.exe"]   # Windows: exact, case-insensitive (1.x src/instance/discovery.rs:62-63)
process_path_patterns = []
command_line_patterns = []
comm_hints = []                                # Linux: pre-filter only (DB revised); no exact-name hint needed
linux_name_contains = ["osu!", "osulazer.exe"] # Linux: userspace substring match on comm (DB revised, 1.x discovery.rs:45-48)
