[package]
name = "vosu-osu-reader"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
arc-swap = "1.8.2"
bytes = "=1.12.1"
chrono = { version = "0.4.44", features = ["serde"] }
indexmap = { version = "2.13.0", features = ["serde"] }
memchr = "=2.8.3"
md-5 = "0.11.0"
parking_lot = "0.12.5"
rust-embed = { version = "=8.12.0", features = ["debug-embed", "include-exclude"] }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "raw_value"] }
sha2 = "=0.11.0"
tempfile = "3.26.0"
thiserror = "2.0.18"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "test-util", "process"] }
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
vosu-net = { path = "../vosu-net" }
vosu-osu-model = { path = "../vosu-osu-model" }
vosu-plugin-api = { path = "../vosu-plugin-api" }
vosu-sys = { path = "../vosu-sys" }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.186"

[build-dependencies]
sha2 = "=0.11.0"

[dev-dependencies]
proptest = "1.12"
vosu-proptest = { path = "../vosu-proptest" }
