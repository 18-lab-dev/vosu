[package]
name = "vosu-sys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
linux-process-events = ["dep:libbpf-cargo", "dep:libbpf-rs"]
test-harness = []

[dependencies]
chrono = "0.4.44"
memchr = "=2.8.3"
semver = "=1.0.28"
thiserror = "2.0.18"
tokio = { version = "=1.52.3", features = ["fs", "sync", "time"] }
tracing = "=0.1.44"

[dev-dependencies]
parking_lot = "0.12.5"
tempfile = "3.26.0"
vosu-proptest = { path = "../vosu-proptest" }

[target.'cfg(windows)'.dependencies]
tempfile = "3.26.0"
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemInformation", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_IO", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "=1.52.3", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.186"
libbpf-rs = { version = "=0.26.2", optional = true }

[target.'cfg(target_os = "linux")'.build-dependencies]
libbpf-cargo = { version = "=0.26.2", optional = true }
