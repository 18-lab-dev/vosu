manifest_version = 1
id = "difficulty"
name = "Difficulty"
version = "0.1.0"
description = "Etterna MinaCalc MSD, score-goal SSR, and experimental Reform course estimates for osu!mania."
author = "18-LAB"

[service]
command = ["bin/vosu-difficulty"]
startup = "on-demand"

[api]
read = ["/v1/beatmap"]
write = ["/v1/calculate"]

[permissions]
host = ["context"]

[cli]
command = ["bin/vosu-difficulty", "cli"]
summary = "Calculate beatmap MSD, SSR, and rate tables"
