[package]
name = "vosu-tool-difficulty"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vosu-difficulty"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", features = ["query"] }
md-5 = "0.11.0"
rosu-map = "=0.2.1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "fs"] }
vosu-tool-sdk = { path = "../vosu-tool-sdk" }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3.26.0"
