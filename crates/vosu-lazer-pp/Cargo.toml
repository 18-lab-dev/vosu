[package]
name = "vosu-lazer-pp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "LGPL-3.0-only"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rosu-map = { version = "=0.2.1", path = "vendor/rosu-map" }
rosu-mods = { version = "=0.4.0", features = ["serde"] }
rosu-pp = { package = "vosu-lazer-pp-core", path = "vendor/rosu-pp", features = ["sync"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
