name: Release daemon

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Validate and package Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libbpf-dev libelf-dev
          echo "C_INCLUDE_PATH=/usr/include/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Validate release tag and package version
        run: python scripts/package-release.py validate-tag --tag "$RELEASE_TAG"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: x86_64-unknown-linux-gnu
      - name: Cache Cargo registry, git database, and release lane artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-rust-1.96.1-release-package-x86_64-unknown-linux-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-Linux-rust-1.96.1-ci-validation-linux-windows-gnu-${{ hashFiles('**/Cargo.lock') }}
            cargo-Linux-rust-1.96.1-ci-validation-linux-windows-gnu-



      - name: Build daemon
        run: cargo build --release --locked --no-default-features --features linux-process-events --target x86_64-unknown-linux-gnu


      - name: Package daemon and license
        run: >-
          python scripts/package-release.py package
          --platform linux
          --tag "$RELEASE_TAG"
          --binary target/x86_64-unknown-linux-gnu/release/vosu
          --output dist

      - name: Extract validated package
        run: >-
          python scripts/package-release.py extract
          --platform linux
          --tag "$RELEASE_TAG"
          --archive "dist/vosu-linux-$RELEASE_TAG.zip"
          --destination release-smoke/linux

      - name: Smoke-test packaged production daemon
        env:
          VOSU_RELEASE_SMOKE_BINARY: ${{ github.workspace }}/release-smoke/linux/vosu
        run: cargo test --locked --test release_smoke -- --ignored --nocapture

      - name: Upload Linux release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: dist/vosu-linux-${{ github.ref_name }}.zip
          if-no-files-found: error

  windows:
    name: Validate, sign, and package Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag and package version
        run: python scripts/package-release.py validate-tag --tag "$env:RELEASE_TAG"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo registry, git database, and release lane artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-rust-1.96.1-release-package-x86_64-pc-windows-msvc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-rust-1.96.1-release-package-x86_64-pc-windows-msvc-



      - name: Build daemon
        run: cargo build --release --locked --no-default-features --target x86_64-pc-windows-msvc


      - name: Upload unsigned daemon for SignPath
        id: upload-unsigned-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-vosu-windows-${{ github.ref_name }}
          path: target/x86_64-pc-windows-msvc/release/vosu.exe
          if-no-files-found: error

      - name: Submit tagged daemon to SignPath
        if: startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 5b025426-9c79-4f04-87e8-64cf64131d0b
          project-slug: vosu
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Package signed daemon and license
        run: >-
          python scripts/package-release.py package
          --platform windows
          --tag "$env:RELEASE_TAG"
          --binary signed/vosu.exe
          --output dist

      - name: Extract validated package
        run: >-
          python scripts/package-release.py extract
          --platform windows
          --tag "$env:RELEASE_TAG"
          --archive "dist/vosu-windows-${env:RELEASE_TAG}.zip"
          --destination release-smoke/windows

      - name: Smoke-test packaged production daemon
        env:
          VOSU_RELEASE_SMOKE_BINARY: ${{ github.workspace }}\release-smoke\windows\vosu.exe
        run: cargo test --locked --test release_smoke -- --ignored --nocapture

      - name: Verify signature and Windows resources
        shell: pwsh
        run: >-
          ./scripts/verify-windows-release.ps1
          -Binary "release-smoke/windows/vosu.exe"
          -Tag "$env:RELEASE_TAG"

      - name: Upload Windows release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/vosu-windows-${{ github.ref_name }}.zip
          if-no-files-found: error

  publish:
    name: Publish exact release assets
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify complete release asset set
        run: >-
          python scripts/package-release.py verify-set
          --tag "$RELEASE_TAG"
          --directory dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3.0.2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/vosu-windows-${{ github.ref_name }}.zip
            dist/vosu-linux-${{ github.ref_name }}.zip
