name: Release daemon

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Validate and package Linux release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libbpf-dev libelf-dev pkg-config zlib1g-dev imagemagick rpm libarchive-tools
          echo "C_INCLUDE_PATH=/usr/include/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Check retained calculator notices in LICENSE
        run: python scripts/assemble-release-license.py

      - name: Check embedded asset digests
        run: python scripts/check-asset-hashes.py

      - name: Validate release tag and package version
        run: python scripts/package-release.py validate-tag --tag "$RELEASE_TAG"

      - name: Prepare embedded offset generator
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          targets: x86_64-unknown-linux-gnu
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache release build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-Linux-ubuntu22-rust-1.96.1-release-events-x86_64-${{ hashFiles('Cargo.lock') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            cargo-Linux-ubuntu22-rust-1.96.1-release-events-x86_64-${{ hashFiles('Cargo.lock') }}-
            cargo-Linux-ubuntu22-rust-1.96.1-release-events-x86_64-


      - name: Build verified offset generator bundle
        run: python scripts/prepare-offset-generator.py --rid linux-x64
      - name: Build daemon
        run: cargo build --release --locked --no-default-features --features linux-process-events --target x86_64-unknown-linux-gnu
      - name: Assert glibc 2.35 baseline
        run: python scripts/package-linux.py check-glibc --binary target/x86_64-unknown-linux-gnu/release/vosu


      - name: Package daemon and license
        run: >-
          python scripts/package-release.py package
          --platform linux
          --tag "$RELEASE_TAG"
          --binary target/x86_64-unknown-linux-gnu/release/vosu
          --output dist

      - name: Extract validated package
        run: >-
          python scripts/package-release.py extract
          --platform linux
          --tag "$RELEASE_TAG"
          --archive "dist/vosu-linux-$RELEASE_TAG.zip"
          --destination release-smoke/linux

      - name: Smoke-test packaged production daemon
        env:
          VOSU_RELEASE_SMOKE_BINARY: ${{ github.workspace }}/release-smoke/linux/vosu
        run: cargo test --locked --package vosu-release-smoke --test release_smoke -- --ignored --nocapture
      - name: Install checksum-pinned nfpm
        run: |
          # Source: https://github.com/goreleaser/nfpm/releases/download/v2.47.0/checksums.txt
          curl -fL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz -o /tmp/nfpm.tar.gz
          echo '0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  /tmp/nfpm.tar.gz' | sha256sum --check
          mkdir -p /tmp/nfpm
          tar -xzf /tmp/nfpm.tar.gz -C /tmp/nfpm nfpm
      - name: Build and inspect distro packages and AUR bundle
        run: python scripts/package-linux.py build --tag "$RELEASE_TAG" --binary target/x86_64-unknown-linux-gnu/release/vosu --output dist --nfpm /tmp/nfpm/nfpm

      - name: Upload Linux release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Validate, sign, and package Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check retained calculator notices in LICENSE
        run: python scripts/assemble-release-license.py

      - name: Check embedded asset digests
        run: python scripts/check-asset-hashes.py

      - name: Validate release tag and package version
        run: python scripts/package-release.py validate-tag --tag "$env:RELEASE_TAG"

      - name: Prepare embedded offset generator
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          targets: x86_64-pc-windows-msvc
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - id: week
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache release build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-Windows-rust-1.96.1-release-msvc-x86_64-${{ hashFiles('Cargo.lock') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            cargo-Windows-rust-1.96.1-release-msvc-x86_64-${{ hashFiles('Cargo.lock') }}-
            cargo-Windows-rust-1.96.1-release-msvc-x86_64-


      - name: Build verified offset generator bundle
        run: python scripts/prepare-offset-generator.py --rid win-x64
      - name: Build daemon
        run: cargo build --release --locked --no-default-features --target x86_64-pc-windows-msvc


      - name: Upload unsigned daemon for SignPath
        id: upload-unsigned-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-vosu-windows-${{ github.ref_name }}
          path: target/x86_64-pc-windows-msvc/release/vosu.exe
          if-no-files-found: error

      - name: Submit tagged daemon to SignPath
        if: startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 5b025426-9c79-4f04-87e8-64cf64131d0b
          project-slug: vosu
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Package signed daemon and license
        run: >-
          python scripts/package-release.py package
          --platform windows
          --tag "$env:RELEASE_TAG"
          --binary signed/vosu.exe
          --output dist

      - name: Extract validated package
        run: >-
          python scripts/package-release.py extract
          --platform windows
          --tag "$env:RELEASE_TAG"
          --archive "dist/vosu-windows-${env:RELEASE_TAG}.zip"
          --destination release-smoke/windows

      - name: Smoke-test packaged production daemon
        env:
          VOSU_RELEASE_SMOKE_BINARY: ${{ github.workspace }}\release-smoke\windows\vosu.exe
        run: cargo test --locked --package vosu-release-smoke --test release_smoke -- --ignored --nocapture

      - name: Verify signature and Windows resources
        shell: pwsh
        run: >-
          ./scripts/verify-windows-release.ps1
          -Binary "release-smoke/windows/vosu.exe"
          -Tag "$env:RELEASE_TAG"

      - name: Upload Windows release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/vosu-windows-${{ github.ref_name }}.zip
          if-no-files-found: error

  install-linux:
    name: Install Linux package (${{ matrix.image }})
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            format: deb
            http: '1'
          - image: ubuntu:22.04
            format: deb
            http: '0'
          - image: ubuntu:24.04
            format: deb
            http: '0'
          - image: fedora:latest
            format: rpm
            http: '0'
          - image: archlinux:latest
            format: pkg.tar.zst
            http: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux
          path: dist
      - name: Install container runtime
        run: sudo apt-get update && sudo apt-get install --yes podman
      - name: Install and smoke-test in clean distro
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
          HTTP_SMOKE: ${{ matrix.http }}
        run: |
          package=$(find dist -maxdepth 1 -name "*.$FORMAT" -printf '%f')
          podman run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/packaging/linux:/checks:ro" -e VOSU_HTTP_SMOKE="$HTTP_SMOKE" "$IMAGE" sh /checks/smoke-install.sh "/packages/$package"
      - name: Confirm restricted capability setup never aborts install
        if: matrix.image == 'debian:12'
        run: |
          package=$(find dist -maxdepth 1 -name '*.deb' -printf '%f')
          set -o pipefail
          podman run --rm --cap-drop SETFCAP -v "$PWD/dist:/packages:ro" -v "$PWD/packaging/linux:/checks:ro" debian:12 sh /checks/smoke-install.sh "/packages/$package" 2>&1 | tee /tmp/restricted-install.log
          grep -F 'vosu: capability setup failed; run /usr/bin/vosu --setup on the host.' /tmp/restricted-install.log

  publish:
    name: Publish exact release assets
    needs:
      - linux
      - windows
      - install-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify complete release asset set
        run: >-
          python scripts/package-release.py verify-set
          --tag "$RELEASE_TAG"
          --directory dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3.0.2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/vosu-windows-${{ github.ref_name }}.zip
            dist/vosu-linux-${{ github.ref_name }}.zip
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/vosu-bin-aur-${{ github.ref_name }}.tar.gz
