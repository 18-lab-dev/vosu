name: Offset generator bundles

on:
  workflow_dispatch:
  push:
    tags:
      - offset-generator-v1

permissions:
  contents: read

env:
  RELEASE_TAG: offset-generator-v1

concurrency:
  group: offset-generator-v1-release
  cancel-in-progress: false

jobs:
  release:
    name: Ensure prerelease
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create prerelease when absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --title "Offset generator bundle v1" \
              --notes "Self-contained Linux and Windows helpers used by vosu -g."

  package:
    name: Package ${{ matrix.rid }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: win-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build verified bundle
        run: python scripts/prepare-offset-generator.py --rid ${{ matrix.rid }}

      - name: Upload bundle to prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "target/offset-generator/${{ matrix.rid }}/offset-generator-v1-${{ matrix.rid }}.zip" \
            "target/offset-generator/${{ matrix.rid }}/offset-generator-v1-${{ matrix.rid }}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
