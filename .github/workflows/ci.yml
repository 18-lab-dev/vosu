name: Rust CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "openwiki/**"
      - ".agents/**"
      - ".gitignore"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "openwiki/**"
      - ".agents/**"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Ubuntu validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux native and Windows cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang gcc-mingw-w64-x86-64 libbpf-dev libelf-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu

      - name: Cache Cargo registry, git database, and validation artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-Linux-rust-1.96.1-ci-validation-linux-windows-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-Linux-rust-1.96.1-ci-validation-linux-windows-gnu-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint Linux targets and features
        env:
          C_INCLUDE_PATH: /usr/include/x86_64-linux-gnu
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace libraries, binaries, integration tests, and examples
        env:
          C_INCLUDE_PATH: /usr/include/x86_64-linux-gnu
        run: cargo test --workspace --lib --bins --tests --examples --all-features --locked

      - name: Check Windows GNU targets and features
        run: cargo check --workspace --all-targets --all-features --locked --target x86_64-pc-windows-gnu
