# Cost policy: hosted-cache saves (Cargo downloads, Rust `target` artifacts)
# run only from `main`, since GitHub scopes caches to the branch that wrote
# them and only `main`'s caches are readable cross-branch; `ci/**` and pull
# request runs restore only. A `main` push whose exact SHA already has a
# passing "CI required" run (recorded by `scripts/land.py`'s ci/<topic>
# landing) skips its own lint/test steps and only rebuilds, without testing,
# to refresh a missed cache; see scripts/ci-check-verified.py.
name: Rust CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      native: ${{ steps.changes.outputs.native }}
      ui: ${{ steps.changes.outputs.ui }}
      week: ${{ steps.week.outputs.week }}
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: changes
        run: python scripts/ci-changes.py
      - name: Check maintained documentation links
        run: python scripts/check-doc-links.py
      - name: Check maintained-file length ratchet
        run: python scripts/check-file-length.py
      - name: Check for unexplained old-brand occurrences
        run: python scripts/check-brand.py
      - name: Check for unexplained lint-expectation attributes
        run: python scripts/check-lint-expectations.py
      - name: Check module dependency boundaries
        run: python scripts/check-module-boundaries.py
      - name: Check workspace-crate dependency boundaries
        run: python scripts/check-crate-boundaries.py
      - name: Check retained calculator notices in LICENSE
        run: python scripts/assemble-release-license.py
      - name: Check embedded asset digests
        run: python scripts/check-asset-hashes.py
      - name: Test repository scripts
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: verified
        name: Check for an already-verified CI required run on this SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci-check-verified.py

  validation:
    name: Ubuntu validation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XWIN_ARCH: x86_64
      XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache
      # With full debuginfo, the all-target test build (~6.6 GB fresh) plus the
      # restored artifact cache ran ld out of space for its mmapped output
      # (SIGBUS). Line tables keep panic backtraces readable at ~3.8 GB.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy, llvm-tools
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc
      - name: Check formatting before native setup
        if: needs.changes.outputs.verified != 'true'
        run: cargo fmt --all -- --check
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libbpf-dev libelf-dev
      - name: Install pinned cargo-xwin
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          # 0.23.0 cannot unpack the current Win11SDK_10.0.26100 manifest
          # ("unable to find x86_64 headers") once no cached SDK exists.
          tool: cargo-xwin@0.23.1
          fallback: none
      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-nextest@0.9.152
          fallback: none
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - name: Restore Rust artifacts
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          # Weekly generations bound archive churn while refreshing workspace artifacts.
          # The "lt" generation excludes full-debuginfo artifacts from earlier keys.
          key: rust-${{ runner.os }}-1.96.1-validation-lt-${{ needs.changes.outputs.week }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-1.96.1-validation-lt-

      - name: Restore independent MSVC SDK
        id: sdk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .xwin-cache
          key: xwin-Linux-0.23.1-vs17-x86_64-desktop-v1
      - name: Prepare MSVC SDK
        run: cargo xwin cache xwin
      - name: Save prepared SDK before validation
        if: steps.sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .xwin-cache
          key: ${{ steps.sdk.outputs.cache-primary-key }}
      - name: Lint Linux targets and features
        if: needs.changes.outputs.verified != 'true'
        env:
          C_INCLUDE_PATH: /usr/include/x86_64-linux-gnu
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test workspace libraries, binaries, integration tests, and examples
        if: needs.changes.outputs.verified != 'true'
        env:
          C_INCLUDE_PATH: /usr/include/x86_64-linux-gnu
        run: cargo nextest run --workspace --lib --bins --tests --examples --all-features --locked
      - name: Check for broken rustdoc intra-doc links
        if: needs.changes.outputs.verified != 'true'
        env:
          C_INCLUDE_PATH: /usr/include/x86_64-linux-gnu
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --no-deps --all-features --locked
      - name: Warm build for cache refresh (already verified on ci/<topic>)
        if: needs.changes.outputs.verified == 'true' && steps.target-cache.outputs.cache-hit != 'true'
        env:
          C_INCLUDE_PATH: /usr/include/x86_64-linux-gnu
        run: cargo test --workspace --lib --bins --tests --examples --all-features --locked --no-run
      - name: Report runner disk headroom
        if: always()
        run: df -h / "${{ github.workspace }}"
      - name: Lint Windows MSVC targets and features
        if: needs.changes.outputs.verified != 'true'
        run: cargo xwin clippy --workspace --all-targets --all-features --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Save Rust artifacts
        if: github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

  dashboard:
    name: Dashboard smoke
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libbpf-dev libelf-dev
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - name: Restore Rust artifacts
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: rust-${{ runner.os }}-1.96.1-dashboard-${{ needs.changes.outputs.week }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-1.96.1-dashboard-
      - name: Build debug daemon
        # Needed to run the smokes, or (on an already-verified main push) to
        # warm a missed cache; a cache hit with no smokes to run is a no-op.
        if: needs.changes.outputs.verified != 'true' || steps.target-cache.outputs.cache-hit != 'true'
        env:
          C_INCLUDE_PATH: /usr/include/x86_64-linux-gnu
        run: cargo build --locked --features test-harness
      - name: Install pinned Node toolchain
        if: needs.changes.outputs.verified != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        if: needs.changes.outputs.verified != 'true'
        working-directory: tests
        run: |
          npm install --no-save playwright@1.61.1
          npx --yes playwright@1.61.1 install --with-deps chromium
      - name: Tool host HTTP boundary smoke
        if: needs.changes.outputs.verified != 'true'
        run: python tests/tool_host_smoke.py --binary target/debug/vosu
      - name: Dashboard browser smoke
        if: needs.changes.outputs.verified != 'true'
        run: python tests/dashboard_smoke.py --binary target/debug/vosu --playwright-module "$PWD/tests/node_modules/playwright/index.mjs"
      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Save Rust artifacts
        if: github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

  windows-native:
    name: Windows MSVC native verification
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # M0 (8af9277) added ~8 workspace crates without this, so the job built
      # full PDB debuginfo for every added test binary: the hosted job grew
      # from 495s to 681s (Restore Rust artifacts 51s->124s from a bigger
      # cached target dir, Test native Windows workspace 337s->440s). Native
      # VM measurement (matched to the public-repo runner's 4 vCPUs, same
      # `cargo test` command) confirmed line tables alone cut per-commit
      # build time ~25-30% and roughly halved the cached target dir (M0
      # 5.43 GB -> 2.65 GB), restoring 8af9277 to parity with 3a91ff9's own
      # current-settings time; see docs/testing/benchmarks.md. Matches the
      # Ubuntu validation job's setting.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          components: clippy
          targets: x86_64-pc-windows-msvc
      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-nextest@0.9.152
          fallback: none
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - name: Restore Rust artifacts
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          # Weekly generations bound archive churn while refreshing workspace
          # artifacts. The "lt" generation excludes full-debuginfo artifacts
          # from earlier keys (see the CARGO_PROFILE_DEV_DEBUG comment above).
          key: rust-${{ runner.os }}-1.96.1-native-msvc-lt-${{ needs.changes.outputs.week }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-1.96.1-native-msvc-lt-

      - name: Lint native Windows targets and features
        if: needs.changes.outputs.verified != 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: Test native Windows workspace
        if: needs.changes.outputs.verified != 'true'
        run: cargo nextest run --workspace --lib --bins --tests --examples --all-features --locked --target x86_64-pc-windows-msvc
      - name: Warm build for cache refresh (already verified on ci/<topic>)
        if: needs.changes.outputs.verified == 'true' && steps.target-cache.outputs.cache-hit != 'true'
        run: cargo test --workspace --lib --bins --tests --examples --all-features --locked --target x86_64-pc-windows-msvc --no-run
      - name: Save Cargo downloads
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Save Rust artifacts
        if: github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

  required:
    name: CI required
    if: always()
    needs: [changes, validation, windows-native, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          CHANGES: ${{ needs.changes.result }}
          VALIDATION: ${{ needs.validation.result }}
          NATIVE: ${{ needs.windows-native.result }}
          DASHBOARD: ${{ needs.dashboard.result }}
          CODE: ${{ needs.changes.outputs.code }}
          NEED_NATIVE: ${{ needs.changes.outputs.native }}
          NEED_UI: ${{ needs.changes.outputs.ui }}
        run: |
          test "$CHANGES" = success
          if [ "$CODE" = true ]; then test "$VALIDATION" = success; fi
          if [ "$NEED_NATIVE" = true ]; then test "$NATIVE" = success; fi
          if [ "$NEED_UI" = true ]; then test "$DASHBOARD" = success; fi
