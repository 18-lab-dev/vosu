name: Nightly

on:
  schedule:
    # 03:17 UTC: off-peak for both GitHub's shared runners and the team.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.61.1

jobs:
  lazer-offset-canary:
    name: Lazer offset generation canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install offset helper build SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Canary the newest osu!lazer release against the embedded offset generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lazer-offset-canary.py

  exploratory-property-tests:
    name: Exploratory property tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOSU_PROPTEST_RANDOM: '1'
      PROPTEST_CASES: '20000'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libbpf-dev libelf-dev
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - name: Restore Rust artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: rust-${{ runner.os }}-1.96.1-nightly-proptest-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-1.96.1-nightly-proptest-
      - name: Run randomized property tests
        env:
          C_INCLUDE_PATH: /usr/include/x86_64-linux-gnu
        run: cargo test --workspace --lib --all-features --locked prop_

  dashboard-browser-smokes:
    name: Dashboard browser smokes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libbpf-dev libelf-dev
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - name: Restore Rust artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: rust-${{ runner.os }}-1.96.1-nightly-dashboard-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-1.96.1-nightly-dashboard-
      - name: Build debug daemon
        env:
          C_INCLUDE_PATH: /usr/include/x86_64-linux-gnu
        run: cargo build --locked --features test-harness
      - name: Install pinned Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        working-directory: tests
        run: |
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium
      - name: Tool host HTTP boundary smoke
        run: python tests/tool_host_smoke.py --binary target/debug/vosu
      - name: Dashboard browser smoke
        run: python tests/dashboard_smoke.py --binary target/debug/vosu --playwright-module "$PWD/tests/node_modules/playwright/index.mjs"
      - name: Catalog art smoke
        run: python tests/catalog_art_smoke.py --binary target/debug/vosu --playwright-module "$PWD/tests/node_modules/playwright/index.mjs"
      - name: Tool catalog smoke
        run: python tests/tool_catalog_smoke.py --binary target/debug/vosu --playwright-module "$PWD/tests/node_modules/playwright/index.mjs"
