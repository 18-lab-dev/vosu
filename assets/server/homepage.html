<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#100E18">
  <title>Vosu dashboard</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/assets/homepage.css">
  <link rel="stylesheet" href="/assets/homepage-controls.css">
  <script src="/assets/homepage.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to dashboard content</a>

  <header class="site-header">
    <a class="brand" href="/" aria-label="Vosu dashboard home">
      <svg class="brand-mark" viewBox="0 0 1024 1024" role="img" aria-labelledby="dashboard-mark-title dashboard-mark-description" shape-rendering="geometricPrecision">
        <title id="dashboard-mark-title">Vosu</title>
        <desc id="dashboard-mark-description">The rose Vosu signal-V mark and cyan signal node on a rounded dark tile.</desc>
        <rect width="1024" height="1024" rx="144" fill="#100E18"></rect>
        <g aria-label="Vosu signal-V symbol" transform="translate(512 500) scale(6.2) translate(-128 -113)">
          <path d="M18 36 H32 L64 94 L96 36 H110" transform="translate(64 46)" fill="none" stroke="#F45CAD" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="128" cy="140" r="10" fill="#100E18"></circle>
          <circle cx="128" cy="140" r="5.5" fill="#7AE1F8"></circle>
        </g>
      </svg>
      <span class="brand-name">Vosu</span>
    </a>

    <nav class="page-tabs" aria-label="Dashboard pages">
      <a class="nav-link" data-page="installed" href="/">
        <span>Installed</span>
        <span class="nav-count" data-count="installed">{{LOCAL_AMOUNT}}</span>
      </a>
      <a class="nav-link" data-page="available" href="/available">
        <span>Available</span>
        <span class="nav-count" data-count="available">{{AVAILABLE_AMOUNT}}</span>
      </a>
      <a class="nav-link" data-page="settings" href="/settings">Settings</a>
    </nav>

    {{SEARCH}}

    <nav class="header-links" aria-label="Vosu resources">
      <a href="https://github.com/shiruviaa/vosu" target="_blank" rel="noopener noreferrer">Source</a>
      <form action="/api/generateReport" method="post"><button type="submit">Download report</button></form>
    </nav>
  </header>

  <section id="update-notice" class="update-notice" {{UPDATE_HIDDEN}} aria-labelledby="update-title">
    <div>
      <p class="eyebrow">Vosu update</p>
      <h2 id="update-title">Version {{NEW_VERSION}} is ready</h2>
      <p>This daemon is running {{CURRENT_VERSION}}. Start the built-in updater when you are ready.</p>
    </div>
    <button class="button button-primary" type="button" data-action="app-update">Update Vosu</button>
  </section>

  <main id="main-content" class="dashboard-main" tabindex="-1">
    <h1 id="page-title" class="visually-hidden">Overlays</h1>

    {{NOTICE}}

    <section id="counter-results" class="results" aria-live="polite" aria-busy="false">
      {{LIST}}
    </section>
  </main>

  <dialog id="dashboard-dialog" class="dashboard-dialog" aria-labelledby="dialog-title">
    <div class="dialog-frame">
      <header class="dialog-header">
        <div>
          <h2 id="dialog-title"></h2>
          <p id="dialog-description"></p>
        </div>
        <button class="icon-button" type="button" data-action="close-dialog" aria-label="Close dialog">Close</button>
      </header>
      <div id="dialog-body" class="dialog-body"></div>
    </div>
  </dialog>

  <dialog id="preview-dialog" class="dashboard-dialog preview-dialog" aria-labelledby="preview-dialog-title">
    <div class="dialog-frame">
      <header class="dialog-header">
        <div>
          <h2 id="preview-dialog-title"></h2>
          <p id="preview-dialog-description"></p>
        </div>
        <button class="button" type="button" data-action="close-preview" aria-label="Close preview">Close</button>
      </header>
      <div class="preview-dialog__frame"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span class="toast__message"></span>
    <button class="button toast__action" type="button" hidden></button>
  </div>
</body>
</html>
