<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 120 120" role="img" aria-labelledby="vosu-mark-title vosu-mark-desc">
<title id="vosu-mark-title">vosu mark</title>
<desc id="vosu-mark-desc">The osu! hit circle with an accent V in front of it, the V standing before the circle as in v + osu. Follows the light or dark colour scheme.</desc>
<style>@media (prefers-color-scheme:dark){.i{stroke:#ebe8e1}.a{fill:#ff963f}}</style>
<mask id="vosu-gap"><rect x="-1" y="-1" width="200" height="200" fill="#fff"/><polygon points="16,16 29.5,16 39,36.9 48.5,16 62,16 42,60 36,60" fill="#000" stroke="#000" stroke-width="12" stroke-linejoin="round"/></mask><circle cx="70" cy="70" r="28" fill="none" class="i" stroke="#132030" stroke-width="12" mask="url(#vosu-gap)"/><polygon points="16,16 29.5,16 39,36.9 48.5,16 62,16 42,60 36,60" class="a" fill="#175fad"/>
</svg>
