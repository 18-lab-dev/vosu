<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="4 5 120 120" role="img" aria-labelledby="vosu-mark-title vosu-mark-desc">
<title id="vosu-mark-title">vosu mark</title>
<desc id="vosu-mark-desc">The signal V: a telemetry line dips into a V with a signal node at its vertex. Follows the light or dark colour scheme.</desc>
<style>@media (prefers-color-scheme:dark){.a{stroke:#ff963f}.s{fill:#7fa6cf}.hd{fill:#ff963f;stroke:#ebe8e1}}</style>
<mask id="vosu-gap"><rect x="-200" y="-200" width="600" height="600" fill="#fff"/><circle cx="64" cy="94" r="10"/></mask><path d="M18 36 H32 L64 94 L96 36 H110" fill="none" class="a" stroke="#175fad" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" mask="url(#vosu-gap)"/><circle cx="64" cy="94" r="5.5" class="s" fill="#b8621b"/>
</svg>
